<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello, World!</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in': 'fadeIn 0.8s ease-out forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(12px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom smooth backdrop blur and radial background glow */
        .bg-grid-pattern {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
        }
        .light .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .light .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        .text-gradient {
            background: linear-gradient(135deg, #60a5fa 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans selection:bg-indigo-500 selection:text-white transition-colors duration-500 relative overflow-x-hidden flex flex-col justify-between" id="app-body">

    <!-- Ambient Glowing Orbs -->
    <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-gradient-to-tr from-indigo-600/20 via-purple-600/20 to-pink-600/20 rounded-full blur-3xl pointer-events-none animate-pulse-slow"></div>
    <div class="fixed -bottom-20 -left-20 w-96 h-96 bg-blue-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed -top-20 -right-20 w-96 h-96 bg-pink-600/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Background Grid Pattern -->
    <div class="fixed inset-0 bg-grid-pattern pointer-events-none"></div>

    <!-- Header Navigation -->
    <header class="relative z-10 w-full max-w-6xl mx-auto px-6 py-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/25">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                </svg>
            </div>
            <span class="font-semibold text-lg tracking-tight">HelloWorld<span class="text-indigo-400">.app</span></span>
        </div>

        <div class="flex items-center gap-4">
            <!-- Theme Toggle Button -->
            <button id="theme-toggle" class="p-2.5 rounded-xl glass-card hover:bg-white/10 dark:hover:bg-white/10 transition-all text-slate-300 dark:text-slate-200" title="Toggle Theme">
                <!-- Sun Icon -->
                <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
                <!-- Moon Icon -->
                <svg id="moon-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Hero Content -->
    <main class="relative z-10 my-auto px-6 py-12 flex flex-col items-center text-center max-w-4xl mx-auto w-full">
        <!-- Status Pill -->
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full glass-card text-xs font-medium text-indigo-300 dark:text-indigo-300 mb-8 animate-fade-in shadow-sm">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            <span class="w-2 h-2 rounded-full bg-emerald-400 absolute"></span>
            <span class="ml-2">Simple • Clean • Modern</span>
        </div>

        <!-- Hero Headline -->
        <h1 id="hero-title" class="text-5xl sm:text-7xl lg:text-8xl font-extrabold tracking-tight mb-6 transition-all duration-300 animate-fade-in">
            <span class="text-gradient">Hello, World!</span>
        </h1>

        <!-- Subtitle -->
        <p id="hero-subtitle" class="text-lg sm:text-xl text-slate-400 dark:text-slate-400 max-w-2xl font-normal leading-relaxed mb-10 animate-fade-in" style="animation-delay: 150ms;">
            Welcome to a minimal web starter template. Clean typography, pleasant colors, and elegant interactions.
        </p>

        <!-- Interactive Syntax / Language Cards -->
        <div class="w-full max-w-2xl glass-card rounded-2xl p-4 sm:p-6 shadow-2xl animate-fade-in" style="animation-delay: 300ms;">
            <!-- Tabs -->
            <div class="flex items-center justify-between border-b border-white/10 dark:border-white/10 pb-3 mb-4 overflow-x-auto gap-2">
                <div class="flex items-center gap-2" id="language-tabs">
                    <button data-lang="html" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium transition-all bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">HTML</button>
                    <button data-lang="javascript" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-white/5 transition-all">JavaScript</button>
                    <button data-lang="python" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-white/5 transition-all">Python</button>
                    <button data-lang="c" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-white/5 transition-all">C++</button>
                    <button data-lang="spanish" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-white/5 transition-all">Español</button>
                    <button data-lang="japanese" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-white/5 transition-all">日本語</button>
                </div>
                
                <!-- Copy Code Button -->
                <button id="copy-btn" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-xs text-slate-300 transition-all border border-white/10 shrink-0">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                    </svg>
                    <span id="copy-text">Copy</span>
                </button>
            </div>

            <!-- Snippet Container -->
            <div class="relative bg-slate-900/80 rounded-xl p-4 text-left font-mono text-sm overflow-x-auto border border-white/5">
                <pre id="code-snippet" class="text-indigo-300"><code>&lt;h1&gt;Hello, World!&lt;/h1&gt;</code></pre>
            </div>
        </div>

        <!-- Interactive Action Buttons -->
        <div class="flex flex-wrap justify-center gap-4 mt-10 animate-fade-in" style="animation-delay: 450ms;">
            <button id="pulse-btn" class="px-6 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-medium hover:opacity-95 transition-all shadow-lg shadow-indigo-500/25 active:scale-95 flex items-center gap-2">
                <span>Say Hello!</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                </svg>
            </button>
            <a href="https://developer.mozilla.org" target="_blank" class="px-6 py-3 rounded-xl glass-card text-slate-300 dark:text-slate-200 font-medium hover:bg-white/10 transition-all border border-white/10 hover:border-white/20 flex items-center gap-2">
                <span>Docs</span>
                <svg class="w-4 h-4 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                </svg>
            </a>
        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 glass-card px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
        <span id="toast-msg" class="text-xs font-medium text-slate-200">Copied to clipboard!</span>
    </div>

    <!-- Minimal Footer -->
    <footer class="relative z-10 w-full max-w-6xl mx-auto px-6 py-6 text-center sm:flex sm:items-center sm:justify-between text-xs text-slate-500 dark:text-slate-400 border-t border-white/5">
        <p>© 2026 Hello World Website. Built with HTML, CSS & JavaScript.</p>
        <div class="flex items-center justify-center gap-6 mt-4 sm:mt-0">
            <span class="inline-flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                Ready to deploy
            </span>
        </div>
    </footer>

    <!-- Interactive JavaScript -->
    <script>
        // Snippet dictionary
        const snippets = {
            html: {
                text: '<h1>Hello, World!</h1>',
                displayHeading: 'Hello, World!',
                subtitle: 'Welcome to a minimal web starter template. Clean typography, pleasant colors, and elegant interactions.'
            },
            javascript: {
                text: 'console.log("Hello, World!");',
                displayHeading: 'console.log("Hello!");',
                subtitle: 'JavaScript power: Simple execution in any browser or server environment.'
            },
            python: {
                text: 'print("Hello, World!")',
                displayHeading: 'print("Hello, World!")',
                subtitle: 'Python simplicity: Readability and clean syntax at its finest.'
            },
            c: {
                text: '#include <iostream>\n\nint main() {\n    std::cout << "Hello, World!";\n    return 0;\n}',
                displayHeading: 'std::cout << "Hello!";',
                subtitle: 'Fast, efficient, and foundational programming.'
            },
            spanish: {
                text: '¡Hola, Mundo!',
                displayHeading: '¡Hola, Mundo!',
                subtitle: 'Un saludo cálido y elegante en español.'
            },
            japanese: {
                text: 'こんにちは、世界！',
                displayHeading: 'こんにちは、世界！',
                subtitle: 'Japan\'s classic greeting to the global developer community.'
            }
        };

        let currentLang = 'html';

        // DOM elements
        const codeSnippet = document.getElementById('code-snippet');
        const heroTitle = document.getElementById('hero-title');
        const heroSubtitle = document.getElementById('hero-subtitle');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const copyBtn = document.getElementById('copy-btn');
        const copyText = document.getElementById('copy-text');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-msg');
        const themeToggle = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        const appBody = document.getElementById('app-body');
        const pulseBtn = document.getElementById('pulse-btn');

        // Tab Switching
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const lang = btn.getAttribute('data-lang');
                if (!snippets[lang]) return;

                currentLang = lang;

                // Update active button styles
                tabBtns.forEach(b => {
                    b.classList.remove('bg-indigo-500/20', 'text-indigo-300', 'border', 'border-indigo-500/30');
                    b.classList.add('text-slate-400');
                });
                btn.classList.add('bg-indigo-500/20', 'text-indigo-300', 'border', 'border-indigo-500/30');
                btn.classList.remove('text-slate-400');

                // Update text content with visual transition
                heroTitle.style.opacity = '0';
                heroTitle.style.transform = 'scale(0.98)';
                
                setTimeout(() => {
                    codeSnippet.textContent = snippets[lang].text;
                    heroTitle.querySelector('span').textContent = snippets[lang].displayHeading;
                    heroSubtitle.textContent = snippets[lang].subtitle;

                    heroTitle.style.opacity = '1';
                    heroTitle.style.transform = 'scale(1)';
                }, 150);
            });
        });

        // Copy to clipboard function
        copyBtn.addEventListener('click', () => {
            const textToCopy = snippets[currentLang].text;
            
            // Native ExecCommand fallback for restricted iframe contexts
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = textToCopy;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            // Toast feedback
            copyText.textContent = 'Copied!';
            showToast('Code copied to clipboard!');
            
            setTimeout(() => {
                copyText.textContent = 'Copy';
            }, 2000);
        });

        // Show Toast Notification
        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Theme Switcher (Dark / Light toggle)
        let isDark = true;

        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            if (isDark) {
                appBody.classList.remove('light', 'bg-slate-50', 'text-slate-900');
                appBody.classList.add('bg-slate-950', 'text-slate-100');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
                showToast('Switched to Dark Mode');
            } else {
                appBody.classList.remove('bg-slate-950', 'text-slate-100');
                appBody.classList.add('light', 'bg-slate-50', 'text-slate-900');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
                showToast('Switched to Light Mode');
            }
        });

        // Interactive "Say Hello!" Button Effect
        const greetingsList = [
            'Hello, World!',
            '¡Hola, Mundo!',
            'Bonjour, le Monde!',
            'Hallo, Welt!',
            'こんにちは、世界！',
            'Ciao, Mondo!',
            'Olá, Mundo!'
        ];
        let greetingIndex = 0;

        pulseBtn.addEventListener('click', () => {
            greetingIndex = (greetingIndex + 1) % greetingsList.length;
            const newGreeting = greetingsList[greetingIndex];
            
            heroTitle.style.opacity = '0';
            setTimeout(() => {
                heroTitle.querySelector('span').textContent = newGreeting;
                heroTitle.style.opacity = '1';
            }, 150);

            showToast(`Greeting changed to: ${newGreeting}`);
        });
    </script>
</body>
</html>
